[project]
name = "lifelinepoi"
version = "0.1.0"
description = "FEMA Lifeline infrastructure POI conflation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "freestiler>=0.1",
    "geopandas>=0.14",
    "pyarrow>=15.0",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "marimo>=0.9",
    "httpx>=0.27",
    "h3>=3.7",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
orchestration = ["prefect>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifelinepoi"]

[tool.ruff]
line-length = 100
target-version = "py311"
