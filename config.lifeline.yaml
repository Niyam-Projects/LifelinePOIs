osm:
  osmium_index_type: "flex_mem"           # Options: flex_mem (default), dense_file_array (planet builds)
  layers:
    - power
    - water_infrastructure
    - telecom
    - fuel
    - safety
    - health
    - transportation
    - education

duckdb:
  memory_limit: "16GB"                    # Increase for larger PBF files

storage:
  root: "/app/data"    # all sub-paths below are relative to root
  bronze_path: "bronze"
  silver_path: "silver"
  gold_path: "gold"
  tiles_path: "tiles"

eia:
  # Direct zip download URLs — update the year when new data is published
  form860_zip_url: "https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602023.zip"
  form923_zip_url: "https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2023.zip"

epa:
  # EPA Facility Registry Service — national single-file CSV zip
  # Source: https://ordsext.epa.gov/FLA/www3/state_files/
  frs_zip_url: "https://ordsext.epa.gov/FLA/www3/state_files/national_single.zip"

echo:
  # EPA ECHO Exporter — one row per regulated facility (~1.5M facilities, ~500 MB)
  exporter_zip_url: "https://echo.epa.gov/files/echodownloads/echo_exporter.zip"

sdwis:
  # EPA SDWIS public water systems via ECHO SDWA data downloads
  sdwa_zip_url: "https://echo.epa.gov/files/echodownloads/SDWA_downloads.zip"

fcc:
  # FCC Antenna Structure Registration (ASR) full database (weekly update)
  asr_zip_url: "https://data.fcc.gov/download/pub/uls/complete/r_tower.zip"

irs:
  # IRS Terminal Control Number (TCN) directory — fuel terminals (monthly update)
  tcn_xlsx_url: "https://www.irs.gov/pub/irs-sbse/tcn-db.xlsx"

eia_api:
  # EIA Open Data API — key stored in .env.local as EIA_API_KEY
  # Register at: https://www.eia.gov/opendata/register.php
  env_key_name: "EIA_API_KEY"
  terminal_stocks_url: "https://api.eia.gov/v2/petroleum/move/terminalstocks/"

conflation:
  name_similarity_threshold: 0.85     # rapidfuzz score (0-1) for name matching
  spatial_proximity_meters: 50.0      # BallTree distance threshold for matching
  confidence_weights:
    distance: 0.40
    attributes: 0.40
    source: 0.20

tiles:
  min_zoom: 4
  max_zoom: 14
  layer_name: "lifeline_poi"

# ---------------------------------------------------------------------------
# Overture Maps Places
# Controls the taxonomy-filtered POI download used for conflation.
# Output: {bronze}/overture/places/us_territories.parquet (all US+territories)
# Per-area bbox clipping happens at conflation time (see areas above).
# ---------------------------------------------------------------------------
overture:
  bucket: "overturemaps-us-west-2"
  s3_region: "us-west-2"
  release: "latest"                # "latest" or a specific version like "2026-04-15.0"
  places_taxonomy:
    - ["health_care", "hospital"]  # First entry = highest priority in conflation
  places_path: ""                  # blank = auto: {bronze}/overture/places/us_territories.parquet
  duckdb_memory_limit: "4GB"       # per-connection DuckDB memory cap (workers × this = peak RAM)
  duckdb_threads: 2                # per-connection DuckDB thread count
  workers: 2                       # number of S3 parts downloaded in parallel

hifld:
  # HIFLD open data via seerai.ai GCS archive — used for confidence validation only
  # (data is frozen/archived; never creates new POIs, only boosts existing OSM points)
  enabled: true

campus_collapse:
  # Campus-style POI collapse: one gold point per campus polygon.
  # Campus polygons (amenity=hospital/university/school/college) collapse all
  # sub-features that fall within their boundary into a single primary POI.
  # Sub-features are retained in silver/campus_buildings.parquet.
  enabled: true
  layers:
    health:
      campus_polygon_amenities:
        - hospital
    education:
      campus_polygon_amenities:
        - university
        - school
        - college
        - kindergarten

epa_naics:
  enabled: true
  pass1_match_distance_m: 50.0      # tight BallTree match — follows HIFLD pattern
  pass2_match_distance_m: 100.0     # re-geocoded point match (building-level placement)
  max_displacement_m: 500.0         # if geocoded addr > this far from FRS coords, use FRS coords as-is
  boost_tier1: 0.25                 # critical infrastructure (power plants, hospitals, water treatment)
  boost_tier2: 0.15                 # high-value infrastructure (pipelines, telecom lines, pharmacies)
  boost_tier3: 0.05                 # supporting infrastructure (gas extraction, freight depots)
  mint_new_pois: true               # create new silver POIs for unmatched FRS lifeline records
  geocode_address_path: "/app/data/bronze/overture/addresses"        # path to Overture address parquet partition root (null = skip Pass 2 re-geocode)

cms:
  # CMS Hospital & Non-Hospital Provider Info — authoritative bed counts + provider attributes.
  # Matching uses a two-tier strategy:
  #   Tier 1 (spatial): BallTree over geocoded CMS records within spatial_match_distance_m.
  #                     Requires a minimum fuzzy name score (spatial_name_threshold) as a guard.
  #   Tier 2 (zip+fuzzy): state + ZIP pre-filter + rapidfuzz name match for unmatched POIs.
  # Writes silver/attr_health_cms.parquet; gold hifld_hospitals.parquet coalesces BEDS from this.
  enabled: true
  api_url: "https://data.cms.gov/data-api/v1/dataset/8ba0f9b4-9493-4aa0-9f82-44ea9468d1b5/data"
  name_similarity_threshold: 0.80   # rapidfuzz token_sort_ratio threshold for Tier 2 (0–1)
  page_size: 5000                   # records per API page (max supported by CMS API)
  spatial_match_distance_m: 200.0   # BallTree buffer for Tier 1 spatial match (meters)
  spatial_name_threshold: 0.55      # min fuzzy score to accept a spatial match (0–1)
  # Overture address geocoding — set to your address parquet root to add coordinates.
  # Recommended: reuse the same path as epa_naics.geocode_address_path.
  geocode_address_path: "/app/data/bronze/overture/addresses"        # e.g. "E:/lifelinepois/data/bronze/overture/addresses"
  geocode_min_score: 0.80           # minimum jaro_winkler street-name score to accept
  geocode_provider_categories:      # PRVDR_CTGRY_CD values to geocode; null = all records
    - "01"                          # "01" = general/acute-care hospitals only
  # Fallback geocoding for records Overture could not match (free services):
  #   Stage 1 — US Census Bureau batch API (50 states + DC + PR)
  #   Stage 2 — Nominatim/OSM for US territory records (VI, GU, MP, AS)
  geocode_census_fallback: true     # set false to skip fallback entirely
