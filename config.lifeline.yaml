# LifelinePOI Configuration
# Edit areas[].pbf_path to point to your local OSM PBF extracts.
# Download regional extracts from: https://download.geofabrik.de/

# ---------------------------------------------------------------------------
# Processing Areas
# Each area binds an OSM PBF extract to an optional bounding box and a list
# of state/territory codes.  bbox is used to clip Overture Places at
# conflation time.  state_codes is stored for future per-source filtering
# (currently informational only).
# ---------------------------------------------------------------------------
